<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>月面キック道場 - 地方初級暗記編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- レトロゲーム風ドット絵フォント -->
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0d1117;
    --pixel-border: #4a5568;
    --text-color: #f7fafc;
    --accent-yellow: #f6e05e;
    --accent-green: #68d391;
    --accent-red: #fc8181;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    font-family: 'DotGothic16', monospace, sans-serif;
  }

  body {
    margin: 0;
    padding: 10px;
    background: radial-gradient(circle at 50% 0%, #26324a 0%, var(--bg-color) 58%);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* レトロモニター風フレーム */
  #game-container {
    width: 100%;
    max-width: 600px;
    background: #1a202c;
    border: 4px solid #718096;
    box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 上部ステータス */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #4a5568;
    padding-bottom: 8px;
    font-size: 14px;
  }

  .moon-status {
    color: var(--accent-yellow);
    font-size: 16px;
  }

  /* バトル・アクション画面 */
  #stage-view {
    position: relative;
    height: 210px;
    background: linear-gradient(180deg, #050811 0%, #171923 100%);
    border: 3px solid #2d3748;
    overflow: hidden;
  }

  #stage-view::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 25px;
    background: repeating-linear-gradient(135deg, #343b4c 0 8px, #252b39 8px 16px);
    border-top: 3px solid #69758c;
    box-shadow: 0 -4px 0 #111722;
  }

  /* 星空背景 */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #fff;
    opacity: 0.7;
  }

  /* 満月（右上） */
  #moon {
    position: absolute;
    top: 15px;
    right: 20px;
    z-index: 1;
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    background: #171923;
    border: 3px solid #faf089;
    box-shadow: 0 0 0 3px #6b5f3a, 0 0 16px #faf089, inset 0 0 10px #faf089;
    filter: drop-shadow(0 0 var(--moon-glow, 16px) #faf089) brightness(var(--moon-brightness, 1));
    transition: filter 0.25s ease, box-shadow 0.25s ease;
  }

  #moon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .dango-icon {
    width: 22px;
    height: 22px;
    vertical-align: middle;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #dango-count {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: var(--accent-yellow);
  }

  #rabbit {
    position: absolute;
    z-index: 2;
    bottom: 25px;
    left: 40px;
    width: auto;
    height: 96px;
    max-width: 110px;
    object-fit: contain;
    object-position: bottom center;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(4px 4px 0 #0b0f18);
  }

  /* キックアニメーション */
  .kick-anim {
    animation: moonKick 0.35s forwards;
  }

  @keyframes moonKick {
    0%   { transform: translate(0, 0) rotate(0deg); }
    40%  { transform: translate(120px, -40px) rotate(-35deg) scale(1.2); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* 敵（問題ブロック） */
  #enemy {
    position: absolute;
    z-index: 2;
    bottom: 25px;
    right: 50px;
    width: auto;
    height: 96px;
    max-width: 110px;
    object-fit: contain;
    object-position: bottom center;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(4px 4px 0 #0b0f18);
  }

  .hit-anim {
    animation: enemyHit 0.35s forwards;
  }

  @keyframes enemyHit {
    0%   { transform: scale(1); filter: brightness(1); }
    45%  { transform: translate(55px, -55px) rotate(180deg) scale(1.08); filter: brightness(2.5); }
    100% { transform: translate(260px, 110px) rotate(540deg) scale(.7); opacity: 0; }
  }

  /* クイズエリア */
  #quiz-box {
    background: #2d3748;
    border: 2px solid #4a5568;
    padding: 12px;
    min-height: 90px;
  }

  .genre-tag {
    display: inline-block;
    background: #e53e3e;
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    margin-bottom: 6px;
  }

  #question-text {
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
  }

  /* 選択肢ボタンエリア */
  #choice-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  @media (min-width: 500px) {
    #choice-container {
      grid-template-columns: 1fr 1fr;
    }
  }

  .choice-btn {
    background: #1a202c;
    color: var(--text-color);
    border: 2px solid #718096;
    padding: 12px;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.05s;
  }

  .choice-btn:active {
    transform: translateY(2px);
    background: #4a5568;
  }

  .key-badge {
    background: #4a5568;
    color: #edf2f7;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 2px;
  }

  /* 解説・フィードバックポップアップ */
  #feedback-overlay {
    display: none;
    background: rgba(0, 0, 0, 0.85);
    border: 3px solid var(--accent-yellow);
    padding: 14px;
    text-align: center;
  }

  #feedback-title {
    font-size: 20px;
    margin-bottom: 8px;
  }

  #feedback-desc {
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 12px;
    text-align: left;
    color: #e2e8f0;
  }

  .next-btn {
    background: var(--accent-yellow);
    color: #000;
    border: none;
    font-size: 16px;
    font-weight: bold;
    padding: 8px 24px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- ステータスバー -->
  <div class="status-bar">
    <div>団子: <span id="dango-count"><img class="dango-icon" src="./dango.png" alt="団子">×<span id="dango-total">0</span></span></div>
    <div class="moon-status">月齢: <span id="moon-phase">三日月</span></div>
    <div>連勝: <span id="combo-count" style="color:var(--accent-green);">0</span></div>
  </div>

  <!-- バトル画面 -->
  <div id="stage-view">
    <div class="star" style="top:20px; left:80px;"></div>
    <div class="star" style="top:50px; left:220px;"></div>
    <div class="star" style="top:30px; left:400px;"></div>
    <div id="moon"><img src="./moon.png" alt="満月"></div>
    <img id="rabbit" src="./rabbit_idle.png" alt="待機中のウサギ">
    <img id="enemy" src="./enemy1.png" alt="敵キャラクター">
  </div>

  <!-- クイズ表示部 -->
  <div id="quiz-box">
    <div class="genre-tag" id="genre-tag">社会科学 - 憲法</div>
    <p id="question-text">読み込み中...</p>
  </div>

  <!-- 選択肢 -->
  <div id="choice-container">
    <button class="choice-btn" onclick="answer(0)"><span class="key-badge">1</span> <span id="c0"></span></button>
    <button class="choice-btn" onclick="answer(1)"><span class="key-badge">2</span> <span id="c1"></span></button>
    <button class="choice-btn" onclick="answer(2)"><span class="key-badge">3</span> <span id="c2"></span></button>
    <button class="choice-btn" onclick="answer(3)"><span class="key-badge">4</span> <span id="c3"></span></button>
  </div>

  <!-- 解説画面 -->
  <div id="feedback-overlay">
    <div id="feedback-title"></div>
    <div id="feedback-desc"></div>
    <button class="next-btn" onclick="nextQuestion()">次の問題へ [Space/Enter]</button>
  </div>
</div>

<script>
// 地方初級・頻出暗記クイズサンプル（スプレッドシート連携でいくらでも増やせます）
const quizData = [
  {
    genre: "社会科学 - 政治",
    q: "日本国憲法において、参議院議員の被選挙権は何歳以上か？",
    choices: ["20歳", "25歳", "30歳", "35歳"],
    ans: 2, // 30歳 (0始まりなので2)
    desc: "衆議院議員・都道府県知事・市区町村長は25歳以上。参議院議員と都道府県知事は30歳以上です。"
  },
  {
    genre: "社会科学 - 経済",
    q: "不景気時に中央銀行（日銀）が行う「金融緩和政策」として正しいものはどれか？",
    choices: ["国債を買い入れる（買いオペ）", "預金準備率を引き上げる", "国債を売り出す（売りオペ）", "政策金利を引き上げる"],
    ans: 0,
    desc: "不景気時は市中にお金を流通させるため『国債の買いオペ』を行い、通貨供給量を増やします。"
  },
  {
    genre: "人文科学 - 日本史",
    q: "1867年に徳川慶喜が政権を朝廷に返上した出来事を何というか？",
    choices: ["版籍奉還", "大政奉還", "廃藩置県", "王政復古の大号令"],
    ans: 1,
    desc: "1867年が大政奉還。その後、討幕派が王政復古の大号令を発して明治政府が誕生しました。"
  }
];

let currentIndex = 0;
let combo = 0;
let dango = 0;
let isAnswered = false;

function loadQuestion() {
  isAnswered = false;
  document.getElementById('feedback-overlay').style.display = 'none';
  document.getElementById('choice-container').style.display = 'grid';
  const rabbit = document.getElementById('rabbit');
  rabbit.className = '';
  rabbit.src = './rabbit_idle.png';

  const q = quizData[currentIndex];
  document.getElementById('genre-tag').innerText = q.genre;
  document.getElementById('question-text').innerText = q.q;

  for (let i = 0; i < 4; i++) {
    document.getElementById(`c${i}`).innerText = q.choices[i];
  }

  // 敵のリセット
  const enemy = document.getElementById('enemy');
  enemy.className = '';
  enemy.style.opacity = '1';
  enemy.src = Math.random() < 0.5 ? './enemy1.png' : './enemy2.png';
}

function answer(choiceIndex) {
  if (isAnswered) return;
  isAnswered = true;

  const q = quizData[currentIndex];
  const rabbit = document.getElementById('rabbit');
  const enemy = document.getElementById('enemy');
  const feedback = document.getElementById('feedback-overlay');
  const fbTitle = document.getElementById('feedback-title');
  const fbDesc = document.getElementById('feedback-desc');

  // キックアニメーション発火
  rabbit.src = './rabbit_kick.png';
  rabbit.classList.add('kick-anim');
  setTimeout(() => {
    rabbit.classList.remove('kick-anim');
    rabbit.src = './rabbit_idle.png';
  }, 350);

  if (choiceIndex === q.ans) {
    // 正解演出
    combo++;
    dango++;
    enemy.classList.add('hit-anim');
    fbTitle.innerHTML = "<span style='color:var(--accent-yellow);'>★ CRITICAL KICK!! 正解 ★</span>";
  } else {
    // 不正解
    combo = 0;
    fbTitle.innerHTML = "<span style='color:var(--accent-red);'>× MISS!! 痛恨の空振り ×</span>";
  }

  // 満ち欠け更新
  updateMoonStatus();

  // 解説の表示
  fbDesc.innerHTML = `<strong>【正解: ${q.choices[q.ans]}】</strong><br>${q.desc}`;
  document.getElementById('choice-container').style.display = 'none';
  feedback.style.display = 'block';
}

function nextQuestion() {
  currentIndex = (currentIndex + 1) % quizData.length;
  loadQuestion();
}

function updateMoonStatus() {
  document.getElementById('combo-count').innerText = combo;
  document.getElementById('dango-total').innerText = dango;

  const phaseElem = document.getElementById('moon-phase');
  const moonElem = document.getElementById('moon');
  const glow = 16 + Math.min(dango, 20) * 4;
  const brightness = 1 + Math.min(dango, 20) * 0.025;
  moonElem.style.setProperty('--moon-glow', `${glow}px`);
  moonElem.style.setProperty('--moon-brightness', brightness.toFixed(2));

  if (dango >= 15) {
    phaseElem.innerText = "皆既月食・極";
  } else if (dango >= 10) {
    phaseElem.innerText = "望月（満月）";
  } else if (dango >= 5) {
    phaseElem.innerText = "上弦の月";
  } else {
    phaseElem.innerText = "三日月";
  }
}

// PC用キーボード操作（1~4でキック、Space/Enterで次へ）
window.addEventListener('keydown', (e) => {
  if (!isAnswered) {
    if (['1', '2', '3', '4'].includes(e.key)) {
      e.preventDefault();
      answer(parseInt(e.key) - 1);
    }
  } else {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      nextQuestion();
    }
  }
});

// 初回読み込み
loadQuestion();
</script>
</body>
</html>
